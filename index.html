<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
:root{
  --bg:#F4F7FB;--card:#FFFFFF;--line:#DCE5EF;
  --text:#0D1F37;--sub:#41516A;--muted:#77869B;
  --blue:#2563EB;--navy:#061A34;--green:#0F766E;--gold:#D4A94F;
  --shadow:0 12px 36px rgba(15,35,67,.08);
  --shadow2:0 20px 52px rgba(15,35,67,.14)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  min-height:100vh;color:var(--text);line-height:1.65;font-size:15px;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 8% 0%,rgba(37,99,235,.09),transparent 29%),
    radial-gradient(circle at 94% 5%,rgba(15,118,110,.07),transparent 25%),
    linear-gradient(180deg,#FAFCFE 0%,#F1F5F9 50%,#F7F9FC 100%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.3;
  background-image:linear-gradient(rgba(15,35,67,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(15,35,67,.025) 1px,transparent 1px);
  background-size:38px 38px
}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.top-nav{
  position:sticky;top:0;z-index:100;padding:10px 24px;
  background:rgba(248,250,253,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(203,213,225,.72)
}
.top-nav-inner{max-width:1220px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.home-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 15px;cursor:pointer;font:800 13px inherit;color:var(--text);transition:.22s;box-shadow:0 3px 12px rgba(15,35,67,.05)}
.home-btn:hover{border-color:#93C5FD;color:var(--blue);transform:translateY(-1px)}
.top-nav-title{font-size:14px;font-weight:760;color:#66758B;letter-spacing:.02em}

.container{max-width:1220px;margin:0 auto;padding:0 24px 68px}
.hdr{text-align:center;padding:54px 0 24px}
.hdr::before{content:"AI TOOL DIRECTORY · KOREA";display:block;font-size:12px;font-weight:900;letter-spacing:.21em;color:#8DA1BB;margin-bottom:12px}
.hdr-badge{display:inline-flex;align-items:center;gap:7px;background:#EFF6FF;border:1px solid #BFDBFE;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:820;color:#1D4ED8;margin-bottom:18px;box-shadow:0 5px 18px rgba(37,99,235,.06)}
.hdr-badge-ico{animation:float 2.5s ease infinite;display:inline-block}
.hdr-title{font-size:54px;font-weight:950;letter-spacing:-.058em;line-height:1.12;margin-bottom:12px;background:linear-gradient(120deg,#071B36 0%,#173B72 42%,#2563EB 70%,#0F766E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-stats{font-size:18px;color:#40516A;margin-bottom:5px;font-weight:700}
.hdr-sub{font-size:15px;color:#7B8799;font-weight:600}

.intro-card{
  max-width:900px;margin:0 auto 24px;border-radius:24px;padding:36px 40px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 100% 0%,rgba(212,169,79,.17),transparent 27%),linear-gradient(135deg,#061A34 0%,#102D56 62%,#123E50 100%);
  box-shadow:0 19px 50px rgba(7,27,54,.18);border:1px solid rgba(255,255,255,.07);animation:fadeIn .5s ease
}
.intro-card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.05),transparent 42%);pointer-events:none}
.intro-text{position:relative;z-index:1;font-size:18px;line-height:1.9;color:#E7EEF8;font-weight:450;word-break:keep-all}
.intro-text .highlight{color:#91D8FF;font-weight:800}
.intro-text .emphasis{color:#F4D58C;font-weight:820}
.intro-text .cta{display:inline-block;margin-top:12px;font-weight:800;color:#fff;font-size:18px}

.brand-panel{
  max-width:980px;margin:0 auto 24px;padding:20px;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(248,251,255,.94));
  border:1px solid var(--line);box-shadow:var(--shadow)
}
.brand-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand-title{font-size:19px;font-weight:900;letter-spacing:-.025em;color:var(--text)}
.brand-desc{font-size:14px;color:var(--muted);margin-top:3px}
.brand-home{
  display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border-radius:11px;text-decoration:none;
  color:#fff;background:linear-gradient(135deg,#0B2B55,#2563EB);font-size:14px;font-weight:850;box-shadow:0 8px 18px rgba(37,99,235,.18)
}
.brand-home:hover{transform:translateY(-1px)}
.brand-social-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.brand-social-link{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:84px;
  border:1px solid #E5EBF2;border-radius:13px;text-decoration:none;background:#fff;transition:.2s
}
.brand-social-link:hover{transform:translateY(-3px);box-shadow:0 9px 20px rgba(15,35,67,.08);border-color:#BCD0E8}
.brand-social-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.brand-social-label{font-size:13px;font-weight:800;color:var(--text);text-align:center}

.kr-popular{margin:0 auto 24px;max-width:940px;background:rgba(255,255,255,.91);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(10px);animation:fadeIn .45s ease}
.kr-popular-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}
.kr-popular-title{font-size:19px;font-weight:900;letter-spacing:-.025em;color:var(--text)}
.kr-popular-sub{font-size:14px;color:var(--muted);margin-top:3px}
.kr-popular-date{font-size:12.5px;font-weight:850;color:#1D4ED8;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px;padding:5px 10px;white-space:nowrap}
.kr-popular-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kr-popular-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:100px;padding:12px 8px;border:1px solid #E7EDF4;border-radius:13px;text-decoration:none;background:linear-gradient(180deg,#fff,#FAFCFE);transition:.22s}
.kr-popular-link:hover{transform:translateY(-3px);border-color:#A9C8F5;box-shadow:0 9px 22px rgba(37,99,235,.09)}
.kr-popular-icon{font-size:26px;line-height:1}
.kr-popular-name{font-size:15px;font-weight:840;color:var(--text);text-align:center;line-height:1.3}
.kr-popular-note{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.25}

.search-wrap{position:relative;margin:0 auto 34px;max-width:780px}
.search-ico{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:17px;color:#8190A6;pointer-events:none}
.search-input{width:100%;padding:18px 22px 18px 52px;border:1px solid #D5DEEA;border-radius:16px;font-size:17px;font-family:inherit;background:rgba(255,255,255,.96);outline:none;transition:.22s;color:var(--text);box-shadow:0 8px 25px rgba(15,35,67,.06)}
.search-input:focus{border-color:#6FA4F5;box-shadow:0 0 0 4px rgba(37,99,235,.08),0 10px 28px rgba(15,35,67,.07)}
.search-input::placeholder{color:#9AA6B6}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cat-card{width:100%;min-height:158px;padding:24px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:19px;cursor:pointer;text-align:left;font-family:inherit;position:relative;overflow:hidden;transition:.28s cubic-bezier(.4,0,.2,1);box-shadow:0 8px 24px rgba(15,35,67,.055);animation:cardIn .4s ease both;display:flex;align-items:center}
.cat-card::after{content:"";position:absolute;right:-48px;bottom:-70px;width:120px;height:120px;border-radius:50%;background:rgba(37,99,235,.05);transition:.28s}
.cat-card:hover{transform:translateY(-5px);box-shadow:var(--shadow2);border-color:#B7C9DF}
.cat-card:hover::after{transform:scale(1.2)}
.cat-bar{position:absolute;top:0;left:0;right:0;height:3px}
.cat-inner{display:flex;align-items:center;gap:13px;width:100%;position:relative;z-index:2}
.cat-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0;border:1px solid rgba(148,163,184,.13)}
.cat-text{flex:1;min-width:0}
.cat-name{font-weight:900;font-size:18px;letter-spacing:-.025em;color:var(--text)}
.cat-sub{font-size:14px;color:var(--muted);margin-top:4px;font-weight:520;line-height:1.42}
.cat-count{font-size:12.5px;font-weight:850;padding:5px 10px;border-radius:999px;flex-shrink:0;white-space:nowrap}

.back-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;color:#607087;font-size:15px;font-weight:760;padding:10px 0;margin-bottom:14px;font-family:inherit;transition:.2s}
.back-btn:hover{color:var(--blue)}
.hero-banner{border-radius:24px;padding:40px;margin-bottom:18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 46px rgba(15,35,67,.15)}
.hero-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.08),transparent 46%);pointer-events:none}
.hero-bg-icon{position:absolute;top:-34px;right:-10px;font-size:160px;opacity:.08;pointer-events:none}
.hero-main-icon{font-size:44px;margin-bottom:11px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.15))}
.hero-title{font-size:34px;font-weight:950;letter-spacing:-.04em;margin-bottom:5px;color:#fff;background:none;-webkit-text-fill-color:#fff}
.hero-subtitle{font-size:17px;opacity:.86;font-weight:560}
.hero-concept{font-size:17px;line-height:1.8;margin-top:15px;opacity:.94;max-width:900px}

.info-toggle-btn{width:100%;padding:15px 19px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-family:inherit;box-shadow:0 5px 18px rgba(15,35,67,.045);transition:.2s}
.info-toggle-btn:hover{border-color:#B7CAE4}
.info-toggle-label{display:flex;align-items:center;gap:8px;font-weight:820;font-size:16px;color:var(--text)}
.info-toggle-arrow{transition:transform .3s}
.info-panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:24px;box-shadow:var(--shadow);animation:fadeIn .3s ease}
.info-section{margin-bottom:21px}.info-section:last-of-type{margin-bottom:0}
.info-section-header{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid #EDF2F7}
.info-section-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.info-section-title{font-weight:840;font-size:16.5px;color:var(--text)}
.info-items{display:flex;flex-direction:column;gap:8px}
.info-item{font-size:15.5px;color:var(--sub);line-height:1.72;padding-left:16px;position:relative}
.info-item .bullet{position:absolute;left:0;font-weight:700;font-size:8px;top:7px}
.info-item strong{color:var(--text);font-weight:730}

.tools-list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.tools-list-title{font-size:20px;font-weight:900;color:var(--text);letter-spacing:-.02em}
.tools-list-count{font-size:13px;font-weight:850;padding:5px 11px;border-radius:999px}
.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.tool-card{display:block;min-height:142px;padding:22px;background:rgba(255,255,255,.97);border-radius:16px;border:1px solid var(--line);text-decoration:none;position:relative;overflow:hidden;transition:.25s cubic-bezier(.4,0,.2,1);box-shadow:0 6px 20px rgba(15,35,67,.045)}
.tool-card:hover{transform:translateY(-4px);box-shadow:var(--shadow2);border-color:#B6CAE4}
.tool-name-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.tool-name{font-weight:860;font-size:17px;color:var(--text);letter-spacing:-.01em}
.tool-badge{font-size:11px;font-weight:850;padding:2px 7px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:15px}
.tool-desc{font-size:14.5px;color:var(--sub);line-height:1.63;padding-right:14px}
.tool-arrow{position:absolute;right:15px;top:16px;font-size:14px;color:#91A0B4;opacity:.65}
.search-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.search-cat-tag{position:absolute;bottom:10px;right:38px;font-size:11.5px;padding:2px 7px;border-radius:6px;font-weight:750;pointer-events:none}

.ftr{text-align:center;margin-top:55px;padding-top:30px;border-top:1px solid #DDE5EF}
.ftr-community-title{font-size:18px;font-weight:900;color:var(--text);letter-spacing:-.02em;margin-bottom:15px}
.social-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px}
.social-link{display:flex;align-items:center;gap:8px;padding:10px 15px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:11px;text-decoration:none;transition:.22s;box-shadow:0 4px 12px rgba(15,35,67,.04)}
.social-link:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,35,67,.08);border-color:#BDD0E7}
.social-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:#fff}
.social-label{font-size:14px;font-weight:740;color:var(--text);white-space:nowrap}
.ftr-copy{font-size:13.5px;color:#8793A5;line-height:1.8}
@media(max-width:980px){.brand-social-grid{grid-template-columns:repeat(4,1fr)}.cat-grid{grid-template-columns:repeat(2,1fr)}.tools-grid,.search-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .top-nav{padding:8px 15px}.top-nav-title{font-size:11.3px}
  .container{padding:0 15px 44px}.hdr{padding:38px 0 20px}.hdr-title{font-size:38px}.hdr-stats{font-size:15px}
  .intro-card{padding:26px 22px;border-radius:18px}.intro-text{font-size:16px}
  .brand-head{align-items:flex-start;flex-direction:column}.brand-social-grid{grid-template-columns:repeat(3,1fr)}
  .kr-popular{padding:18px}.kr-popular-grid{grid-template-columns:repeat(3,1fr)}
  .hero-banner{padding:28px}.hero-title{font-size:27px}.hero-bg-icon{font-size:118px}
  .tools-grid,.search-grid{grid-template-columns:1fr}
}
@media(max-width:540px){
  .hdr{padding-top:31px}.hdr-title{font-size:32px}.hdr::before{font-size:9.3px}
  .cat-grid{grid-template-columns:1fr}.cat-card{min-height:124px;padding:19px}.cat-icon{width:48px;height:48px;font-size:23px}
  .brand-panel{padding:16px}.brand-social-grid{grid-template-columns:repeat(2,1fr)}
  .kr-popular-head{align-items:flex-start;flex-direction:column;gap:7px}.kr-popular-grid{grid-template-columns:repeat(2,1fr)}
  .search-input{padding:16px 17px 16px 46px;font-size:15.5px}
  .hero-banner{padding:24px;border-radius:18px}.hero-title{font-size:24px}.hero-concept{font-size:15px}
  .info-panel{padding:20px}.tool-card{min-height:116px;padding:18px}
  .social-link{padding:7px 10px}.social-label{font-size:11px}
}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#BAC7D7;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

const badgeStyles={"2026 TOP":{bg:"#E0E7FF",text:"#3730A3",border:"#C7D2FE",icon:"🏆"},"기업":{bg:"#E2E8F0",text:"#334155",border:"#CBD5E1",icon:"🏢"},"유쌤추천":{bg:"#FEF3C7",text:"#B45309",border:"#FDE68A",icon:"⭐"},"국내인기":{bg:"#ECFDF5",text:"#047857",border:"#A7F3D0",icon:"📈"},"국내":{bg:"#DBEAFE",text:"#1D4ED8",border:"#BFDBFE",icon:"🇰🇷"},"NEW":{bg:"#FCE7F3",text:"#BE185D",border:"#FBCFE8",icon:"✨"},"HOT":{bg:"#FEE2E2",text:"#B91C1C",border:"#FECACA",icon:"🔥"},"아바타":{bg:"#EDE9FE",text:"#6D28D9",border:"#DDD6FE",icon:"🧑"}};
function matchSearch(t,q){const s=q.toLowerCase();return t.name.toLowerCase().includes(s)||t.desc.toLowerCase().includes(s)||(t.alias&&t.alias.some(a=>a.toLowerCase().includes(s)))}
function ToolCard({tool}){const b=tool.badge?badgeStyles[tool.badge]||badgeStyles["유쌤추천"]:null;return(<a href={tool.url} target="_blank" rel="noopener noreferrer" className="tool-card"><div style={{paddingRight:"24px"}}><div className="tool-name-row"><span className="tool-name">{tool.name}</span>{b&&<span className="tool-badge" style={{background:b.bg,color:b.text,borderColor:b.border}}>{b.icon} {tool.badge}</span>}</div><p className="tool-desc">{tool.desc}</p></div><span className="tool-arrow">↗</span></a>)}
function InfoPanel({title,items,icon,color}){return(<div className="info-section"><div className="info-section-header"><span className="info-section-icon" style={{background:color+"14"}}>{icon}</span><span className="info-section-title">{title}</span></div><div className="info-items">{items.map((item,i)=>{const p=item.split(" — ");return(<div key={i} className="info-item"><span className="bullet" style={{color}}>●</span>{p.length>1?<span><strong>{p[0]}</strong> — {p[1]}</span>:<span>{item}</span>}</div>)})}</div></div>)}
function CategoryDetail({category,onBack}){const[showInfo,setShowInfo]=useState(false);return(<div style={{animation:"slideIn 0.35s ease"}}><button onClick={onBack} className="back-btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>전체 카테고리</button><div className="hero-banner" style={{background:category.gradient}}><div className="hero-bg-icon">{category.icon}</div><div style={{position:"relative",zIndex:1}}><div className="hero-main-icon">{category.icon}</div><h2 className="hero-title">{category.name}</h2><p className="hero-subtitle">{category.subtitle}</p><p className="hero-concept">{category.concept}</p></div></div><button onClick={()=>setShowInfo(!showInfo)} className="info-toggle-btn"><span className="info-toggle-label"><span style={{fontSize:"17px"}}>📖</span><span>주요기능 · 활용분야 · 주의점</span></span><svg width="20" height="20" viewBox="0 0 20 20" fill="none" className="info-toggle-arrow" style={{transform:showInfo?"rotate(180deg)":"rotate(0)"}}><path d="M5 8l5 5 5-5" stroke="#94A3B8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>{showInfo&&(<div className="info-panel"><InfoPanel icon="⚡" title="주요 기능" items={category.features} color={category.color}/><InfoPanel icon="🎯" title="주요 활용 분야" items={category.useCases} color={category.color}/><InfoPanel icon="⚠️" title="주의점" items={category.cautions} color="#DC2626"/></div>)}<div className="tools-list-header"><h3 className="tools-list-title">추천 AI 도구</h3><span className="tools-list-count" style={{background:category.color+"14",color:category.color}}>{category.tools.length}개</span></div><div className="tools-grid">{category.tools.map((t,i)=><ToolCard key={i} tool={t}/>)}</div></div>)}
function CategoryCard({category,onClick,idx}){return(<button onClick={onClick} className="cat-card" style={{animationDelay:idx*0.04+"s"}}><div className="cat-bar" style={{background:category.gradient}}/><div className="cat-inner"><div className="cat-icon" style={{background:category.color+"10"}}>{category.icon}</div><div className="cat-text"><div className="cat-name">{category.name}</div><div className="cat-sub">{category.subtitle}</div></div><div className="cat-count" style={{background:category.color+"12",color:category.color}}>{category.tools.length}개</div></div></button>)}

<!-- ===== 우클릭 / 소스보기 단축키 제한 ===== -->
<script>
(function () {
  'use strict';

  // 브라우저 기본 우클릭 메뉴를 막아 "페이지 소스 보기" 항목이 보이지 않도록 합니다.
  document.addEventListener('contextmenu', function (event) {
    event.preventDefault();
  }, true);

  // 대표적인 개발자도구 / 소스보기 단축키 제한
  document.addEventListener('keydown', function (event) {
    const key = (event.key || '').toLowerCase();
    const ctrlOrMeta = event.ctrlKey || event.metaKey;

    const blocked =
      event.key === 'F12' ||
      (ctrlOrMeta && key === 'u') ||
      (ctrlOrMeta && event.shiftKey && ['i', 'j', 'c'].includes(key));

    if (blocked) {
      event.preventDefault();
      event.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
